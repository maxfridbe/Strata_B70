# Fork-only image publishing; manual runs select the deployment tag.
name: sycl-image

on:
  push:
    branches: [a770-dg2]
    paths: ["sycl/**", "src/**", "include/**", "serve/**", "tools/**", "data/**", ".github/workflows/sycl-image.yml"]
  workflow_dispatch:
    inputs:
      tag:
        description: Deployment image tag (the commit SHA is also published)
        type: string
        required: true
        default: a770-dg2

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/strata-sycl

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Free disk for the oneAPI base image
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker image prune --all --force
          df -h /
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: sycl/tools/Dockerfile.serve
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:${{ inputs.tag || 'a770-dg2' }}
